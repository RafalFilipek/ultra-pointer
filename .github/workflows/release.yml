name: Release

# Publish a release in either of two ways:
#   1. Push a version tag:  npm version minor && git push --follow-tags
#   2. Actions → Release → "Run workflow" with "publish" ticked. This tags the
#      current commit as v<package.json version>.
# Pull requests run the same builds without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.publish }}" == true ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Ultra Pointer ${TAG#v}" --generate-notes
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (and upload to the draft release)
        run: npx electron-builder ${{ matrix.target }} --publish ${{ needs.prepare.outputs.publish == 'true' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: ultra-pointer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
